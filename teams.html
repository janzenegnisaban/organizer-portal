<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teams — KaliArena Organizer</title>
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="loading-overlay" id="loading-overlay"><div class="spinner"></div></div>

  <div class="app-shell hidden" id="app-shell">
    <aside class="sidebar">
      <div class="sidebar-logo"><img src="logo.png" alt="KaliArena" style="height:2rem;width:auto;object-fit:contain;flex-shrink:0;"><span class="sidebar-logo-text">KaliArena</span></div>
      <div class="sidebar-badge-area" id="sidebar-badge"></div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
    </aside>

    <div class="main-content">
      <header class="portal-header">
        <div class="header-left"><div class="header-title">Registered Teams</div></div>
        <div class="header-right">
          <span class="header-user-name" id="header-user-name"></span>
          <div class="header-avatar" id="header-avatar">?</div>
        </div>
      </header>

      <main class="page-content">
        <div class="page-wrap">
          <div class="page-header">
            <div class="page-header-text">
              <h1 class="page-title">Registered Teams</h1>
              <p class="page-subtitle">Coaches and teams that have joined your competitions.</p>
            </div>
          </div>

          <div id="events-breakdown">
            <div class="text-sm text-muted">Loading…</div>
          </div>
        </div>
      </main>

      <nav class="mobile-nav" id="mobile-nav"></nav>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script>
    const PAGE = 'teams.html';

    async function init() {
      const ctx = await requireRole();
      if (!ctx) return;
      const orgId = ctx.session.user.id;
      renderNav(PAGE);
      setHeaderUser(ctx.profile);

      // Get my events + their registrations + coach teams
      const { data: events } = await window.db
        .from('competitions')
        .select('id, name, status, admin_approval_status, competition_registrations(id, coach_id, created_at, profiles!coach_id(first_name, last_name, email), teams!coach_id(name, players_count))')
        .eq('organizer_id', orgId)
        .order('created_at', { ascending: false });

      const container = document.getElementById('events-breakdown');
      const all = events || [];

      if (all.length === 0) {
        container.innerHTML = `<div class="empty-state"><i data-lucide="users"></i><h3>No events yet</h3><p>Create events first, then coaches will join them.</p></div>`;
        refreshIcons();
        showApp();
        return;
      }

      const totalRegs = all.reduce((s, ev) => s + (ev.competition_registrations?.length || 0), 0);

      container.innerHTML = `
        <div class="stats-grid-3" style="margin-bottom:1.5rem;">
          <div class="stat-card"><div class="stat-icon tile-emerald"><i data-lucide="calendar-days"></i></div><div class="stat-label">My Events</div><div class="stat-value">${all.length}</div></div>
          <div class="stat-card"><div class="stat-icon tile-blue"><i data-lucide="users"></i></div><div class="stat-label">Total Registrations</div><div class="stat-value">${totalRegs}</div></div>
        </div>
      ` +
      all.map(ev => {
        const regs = ev.competition_registrations || [];
        return `
          <div class="card" style="margin-bottom:1rem;">
            <div class="card-header">
              <div class="card-title">
                <i data-lucide="calendar-days"></i>
                ${escHtml(ev.name)}
                <span class="spacer"></span>
                ${statusBadge(ev.admin_approval_status || 'pending')}
                <span class="badge badge-gray">${regs.length} team${regs.length !== 1 ? 's' : ''}</span>
              </div>
            </div>
            <div class="card-content" style="padding-top:.5rem;">
              ${regs.length === 0 ? `<p class="text-sm text-muted">No teams registered yet.</p>` : `
                <div class="table-scroll">
                  <table>
                    <thead><tr><th>Coach</th><th>Team</th><th>Players</th><th>Registered</th></tr></thead>
                    <tbody>
                      ${regs.map(r => {
                        const coach = r.profiles;
                        const team  = r.teams;
                        const cName = coach?.first_name ? `${coach.first_name} ${coach.last_name || ''}`.trim() : coach?.email || '—';
                        return `
                          <tr>
                            <td><div class="flex items-center gap-2"><div class="avatar avatar-sm">${getInitials(cName)}</div><span class="font-medium text-sm">${escHtml(cName)}</span></div></td>
                            <td class="text-sm">${team ? escHtml(team.name) : '—'}</td>
                            <td class="text-sm">${team?.players_count || 0}</td>
                            <td class="text-sm text-muted">${formatDate(r.created_at)}</td>
                          </tr>
                        `;
                      }).join('')}
                    </tbody>
                  </table>
                </div>
              `}
            </div>
          </div>
        `;
      }).join('');

      showApp();
      refreshIcons();
    }

    init();
  </script>
</body>
</html>
